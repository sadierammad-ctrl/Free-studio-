name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Generate Android Project & Build Release APK
        run: |
          mkdir -p android-project && cd android-project
          bubblewrap init --manifest="https://ais-dev-5fvnfquk5wkldfy6wz57ky-215531339440.asia-east1.run.app/manifest.json" --skipPwaValidation
          bubblewrap build --apk
          find . -name "*.apk" -exec cp {} ../FREE-STUDIO-release.apk \;

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FREE-STUDIO-release-apk
          path: FREE-STUDIO-release.apk
          retention-days: 30
