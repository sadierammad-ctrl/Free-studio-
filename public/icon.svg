<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" />

  <!-- Subtle Outer Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ef4444" stroke-width="6" opacity="0.35" />

  <!-- Shield Shape -->
  <path d="M 256,90 L 375,145 C 375,260 256,365 256,395 C 256,365 137,260 137,145 Z" fill="url(#shieldGrad)" />

  <!-- Play Triangle inside Shield -->
  <polygon points="230,195 315,250 230,305" fill="#ffffff" />

  <!-- Sparkle Accent (Fair Use & Magic) -->
  <path d="M 365,110 L 375,135 L 400,145 L 375,155 L 365,180 L 355,155 L 330,145 L 355,135 Z" fill="url(#goldGrad)" />
</svg>
